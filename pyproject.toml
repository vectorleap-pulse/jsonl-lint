[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonl-lint"
version = "0.1.0"
description = "Zero-dependency validator that reports every malformed line in a JSONL file, not just the first."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["jsonl", "ndjson", "json", "lint", "validation", "dataset"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
jsonl-lint = "jsonl_lint.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
